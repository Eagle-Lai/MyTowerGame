<?xml version="1.0" encoding="UTF-8"?>
<!-- 04_SettingView.svg — 无声版本设置界面，2026-10-23。
     数据源: SettingView.prefab / UIPrefabBuilder，语言选择、重置存档、关闭。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="ds-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3444"/><stop offset="0.5" stop-color="#1B2330"/><stop offset="1" stop-color="#222C3B"/>
    </linearGradient>
    <radialGradient id="ds-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.62" stop-color="#0B0E14" stop-opacity="0"/><stop offset="1" stop-color="#0B0E14" stop-opacity="0.66"/>
    </radialGradient>
    <filter id="ds-neon" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#35E0FF" flood-opacity="0.85"/>
    </filter>
    <pattern id="ds-stars" width="220" height="220" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="40" r="1.2" fill="#E8F0FA" fill-opacity="0.4"/>
      <circle cx="130" cy="22" r="0.8" fill="#E8F0FA" fill-opacity="0.28"/>
      <circle cx="186" cy="104" r="1.4" fill="#35E0FF" fill-opacity="0.3"/>
      <circle cx="74" cy="150" r="0.9" fill="#E8F0FA" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- 背景：来源界面（本例为暂停界面上叠加）+ 遮罩 -->
  <rect width="1920" height="1080" fill="#10141D"/>
  <rect width="1920" height="1080" fill="url(#ds-stars)"/>
  <g opacity="0.4">
    <rect x="240" y="140" width="1440" height="800" fill="#131A26"/>
    <path d="M240 300H1680M240 460H1680M240 620H1680M240 780H1680" stroke="#1C2532" stroke-width="2"/>
    <rect x="240" y="140" width="1440" height="800" fill="none" stroke="#233246" stroke-width="2"/>
    <path d="M320 540 H1600" stroke="#35E0FF" stroke-opacity="0.25" stroke-width="20"/>
  </g>
  <rect width="1920" height="1080" fill="#000000" fill-opacity="0.55"/>
  <rect width="1920" height="1080" fill="url(#ds-vig)"/>

  <!-- Panel 620×560 居中；所有坐标按 1920×1080 参考画布 -->
  <rect x="650" y="260" width="620" height="560" rx="16" fill="url(#ds-panel)" stroke="#35E0FF" stroke-opacity="0.6" stroke-width="2"/>
  <g font-family="Microsoft YaHei, sans-serif" text-anchor="middle">
    <text x="960" y="330" font-size="38" fill="#E8F0FA">设置</text>
    <text x="960" y="459" font-size="32" fill="#E8F0FA">语言</text>
    <rect x="800" y="484" width="320" height="72" rx="10" fill="#202C3B" stroke="#35E0FF" stroke-opacity="0.65" stroke-width="2"/>
    <text x="944" y="532" font-size="30" fill="#E8F0FA">简体中文</text>
    <path d="M1080 514 L1090 528 L1100 514" fill="none" stroke="#9FB3C8" stroke-width="2"/>
    <rect x="800" y="594" width="320" height="72" rx="10" fill="#3A1A22" stroke="#FF4D5E" stroke-opacity="0.8" stroke-width="2"/>
    <text x="960" y="642" font-size="30" fill="#FFD9DD">重置存档</text>
    <rect x="800" y="682" width="320" height="72" rx="10" fill="#123845" stroke="#35E0FF" stroke-width="2"/>
    <text x="960" y="730" font-size="30" fill="#DFFAFF">关闭</text>
    <text x="960" y="872" font-size="20" fill="#9FB3C8">语言切换立即保存；重置需确认；关闭返回来源界面</text>
  </g>
</svg>
