<?xml version="1.0" encoding="UTF-8"?>
<!-- 04_SettingView.svg — 设置界面【正式版·深色科幻】
     几何与 SettingView.prefab 实测一致（勿改坐标）；视觉为深色科幻重设计
     数据源: Assets/Prefabs/UI/SettingView.prefab + SettingView.cs
     音量步长 ±10%；静音切换文案；重置存档后 Tips "存档已重置"；记录来源界面原路返回 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="ds-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3444"/><stop offset="0.5" stop-color="#1B2330"/><stop offset="1" stop-color="#222C3B"/>
    </linearGradient>
    <radialGradient id="ds-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.62" stop-color="#0B0E14" stop-opacity="0"/><stop offset="1" stop-color="#0B0E14" stop-opacity="0.66"/>
    </radialGradient>
    <filter id="ds-neon" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#35E0FF" flood-opacity="0.85"/>
    </filter>
    <pattern id="ds-stars" width="220" height="220" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="40" r="1.2" fill="#E8F0FA" fill-opacity="0.4"/>
      <circle cx="130" cy="22" r="0.8" fill="#E8F0FA" fill-opacity="0.28"/>
      <circle cx="186" cy="104" r="1.4" fill="#35E0FF" fill-opacity="0.3"/>
      <circle cx="74" cy="150" r="0.9" fill="#E8F0FA" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- 背景：来源界面（本例为暂停界面上叠加）+ 遮罩 -->
  <rect width="1920" height="1080" fill="#10141D"/>
  <rect width="1920" height="1080" fill="url(#ds-stars)"/>
  <g opacity="0.4">
    <rect x="240" y="140" width="1440" height="800" fill="#131A26"/>
    <path d="M240 300H1680M240 460H1680M240 620H1680M240 780H1680" stroke="#1C2532" stroke-width="2"/>
    <rect x="240" y="140" width="1440" height="800" fill="none" stroke="#233246" stroke-width="2"/>
    <path d="M320 540 H1600" stroke="#35E0FF" stroke-opacity="0.25" stroke-width="20"/>
  </g>
  <rect width="1920" height="1080" fill="#000000" fill-opacity="0.55"/>
  <rect width="1920" height="1080" fill="url(#ds-vig)"/>

  <!-- Panel 620×600 → x650..1270, y240..840 -->
  <polygon points="650,256 666,240 1254,240 1270,256 1270,824 1254,840 666,840 650,824" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
  <polygon points="654,258 668,244 1252,244 1266,258 1266,822 1252,836 668,836 654,822" fill="none" stroke="#35E0FF" stroke-opacity="0.22" stroke-width="1"/>
  <path d="M666 241 H1254" stroke="#35E0FF" stroke-opacity="0.4" stroke-width="2"/>

  <g stroke="#35E0FF" stroke-opacity="0.8" fill="none" stroke-width="2">
    <circle cx="884" cy="294" r="9"/>
    <path d="M884 281 V285 M884 303 V307 M871 294 H875 M893 294 H897 M875 285 L878 288 M890 300 L893 303 M893 285 L890 288 M878 300 L875 303"/>
  </g>
  <text x="960" y="308" font-size="40" fill="#E8F0FA" font-weight="700" text-anchor="middle">设置</text>

  <!-- VolumeText pos(0,120) → y=420 -->
  <text x="960" y="432" font-size="32" fill="#9FB3C8" text-anchor="middle">音量 <tspan fill="#E8F0FA" font-weight="600">80%</tspan></text>
  <!-- VolDownBtn pos(-161,40) → (799,500) / VolUpBtn pos(161,40) → (1121,500)，各 290×72
       合计 290+32+290 = 612，正好铺满面板内区 654..1266（对称，不溢出） -->
  <polygon points="666,464 942,464 954,476 954,524 942,536 666,536 654,524 654,476" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
  <text x="799" y="511" font-size="30" fill="#C9D6E8" text-anchor="middle">音量 −</text>
  <polygon points="986,464 1254,464 1266,476 1266,524 1254,536 986,536 974,524 974,476" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
  <text x="1121" y="511" font-size="30" fill="#C9D6E8" text-anchor="middle">音量 ＋</text>
  <!-- MuteBtn pos(0,-50) → y=590 -->
  <polygon points="812,554 1108,554 1120,566 1120,614 1108,626 812,626 800,614 800,566" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
  <text x="960" y="601" font-size="30" fill="#C9D6E8" text-anchor="middle">静 音</text>
  <!-- ResetBtn pos(0,-140) → y=680（危险操作·红） -->
  <polygon points="812,644 1108,644 1120,656 1120,704 1108,716 812,716 800,704 800,656" fill="#3A1A22" stroke="#FF4D5E" stroke-opacity="0.8" stroke-width="2"/>
  <text x="960" y="691" font-size="30" fill="#FFD9DD" text-anchor="middle">重置存档</text>
  <!-- CloseBtn pos(0,-230) → y=770（主按钮·青） -->
  <polygon points="812,734 1108,734 1120,746 1120,794 1108,806 812,806 800,794 800,746" fill="#123845" stroke="#35E0FF" stroke-width="2.5" filter="url(#ds-neon)"/>
  <text x="960" y="781" font-size="30" fill="#DFFAFF" font-weight="600" text-anchor="middle">关 闭</text>

  <!--标注层（图纸引出线，交付实现时可删） -->
  <g id="annotations" font-family="Consolas,monospace">
    <text x="656" y="222" font-size="20" fill="#9FB3C8" fill-opacity="0.8">Panel 620×600 居中 · 来源界面原路返回（本例叠加于暂停界面）</text>
    <text x="1140" y="428" font-size="20" fill="#9FB3C8" fill-opacity="0.8">音量步长 ±10%（0–100%）</text>
    <line x1="1096" y1="424" x2="1030" y2="428" stroke="#9FB3C8" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="1140" y="596" font-size="20" fill="#9FB3C8" fill-opacity="0.8">静音后文案切换"取消静音"，即时生效（AudioManager）</text>
    <line x1="1136" y1="592" x2="1122" y2="590" stroke="#9FB3C8" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="656" y="880" font-size="20" fill="#9FB3C8" fill-opacity="0.8">重置存档：清空关卡解锁/星级/设置 → Tips"存档已重置"；关闭后按来源（选关/暂停）原路返回</text>
    <text x="44" y="1040" font-size="16" fill="#9FB3C8" fill-opacity="0.6">深色科幻正式版 · SettingView.prefab + SettingView.cs · 危险操作（重置存档）用红色描边弱化主视觉</text>
  </g>
</svg>
