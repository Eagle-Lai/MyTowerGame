<?xml version="1.0" encoding="UTF-8"?>
<!-- 22_ConfirmView.svg — 出售确认 + 通用确认弹窗【正式版·深色科幻】
     几何与 prefab 实测一致（勿改坐标）；数据源: ArtDesign_自由人塔防_补全策划案_v1.md §C1/§C2
     坐标换算 x=960+X, y=540−Y
     ★ 布局重排版（v2）：两个弹窗面板加高，按钮全部收进面板内，不再溢出
       左 SellConfirm 800×620（y_svg 230..850）｜右 Confirm 760×560（y_svg 260..820） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="ds-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3444"/><stop offset="0.5" stop-color="#1B2330"/><stop offset="1" stop-color="#222C3B"/>
    </linearGradient>
    <radialGradient id="ds-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.62" stop-color="#0B0E14" stop-opacity="0"/><stop offset="1" stop-color="#0B0E14" stop-opacity="0.66"/>
    </radialGradient>
    <filter id="ds-neon-red" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FF7A29" flood-opacity="0.8"/>
    </filter>
    <filter id="ds-neon" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#35E0FF" flood-opacity="0.85"/>
    </filter>
    <pattern id="ds-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1C2532" stroke-width="1"/>
    </pattern>
  </defs>

  <!--世界层示意 -->
  <rect width="1920" height="1080" fill="#10141D"/>
  <rect x="240" y="140" width="1440" height="800" fill="#131A26"/>
  <rect x="240" y="140" width="1440" height="800" fill="url(#ds-grid)" opacity="0.6"/>
  <path d="M320 540 H1600" fill="none" stroke="#35E0FF" stroke-opacity="0.35" stroke-width="18"/>

  <!-- 压暗遮罩 -->
  <rect width="1920" height="1080" fill="#06090E" fill-opacity="0.78"/>

  <!--左：SellConfirmView 800×620 中心 (480,540) → x 80..880, y 230..850 -->
  <g>
    <rect x="80" y="230" width="800" height="620" rx="12" fill="#1E2939" stroke="#3A4A63" stroke-width="2"/>
    <path d="M80 254 L80 242 Q80 230 92 230 L868 230 Q880 230 880 242 L880 254 Z" fill="#FF7A29"/>

    <!-- 标题 300 -->
    <text x="480" y="316" font-size="48" fill="#E8F0FA" font-weight="700" text-anchor="middle" font-family="Source Han Serif SC,serif">确认出售？</text>

    <!-- 塔图标 380（半径 30） -->
    <circle cx="480" cy="382" r="26" fill="#2E4A66" stroke="#5E7396" stroke-width="3"/>
    <path d="M454 382 a26 26 0 0 1 52 0" fill="none" stroke="#8C6239" stroke-width="5"/>
    <g transform="rotate(45 480 379)"><rect x="474" y="353" width="11" height="52" rx="4" fill="#9FB3C8" stroke="#3A4A63" stroke-width="1.5"/><rect x="450" y="374" width="52" height="11" rx="4" fill="#9FB3C8" stroke="#3A4A63" stroke-width="1.5"/></g>
    <circle cx="480" cy="379" r="8" fill="#C9D6E8"/>

    <!-- 塔名 450 -->
    <text x="480" y="462" font-size="32" fill="#E8F0FA" text-anchor="middle" font-family="Source Han Serif SC,serif">速射塔 Lv.2</text>

    <!-- 警示 520 / 552 -->
    <text x="480" y="528" font-size="27" fill="#FF7A29" text-anchor="middle" font-family="Source Han Serif SC,serif">出售后将退回 70% 的累计投入</text>
    <text x="480" y="562" font-size="27" fill="#FF7A29" text-anchor="middle" font-family="Source Han Serif SC,serif">且无法撤销</text>

    <!-- 退回金额行 620（两个文本并排，中间留距） -->
    <text x="380" y="630" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="Source Han Serif SC,serif">退回金币</text>
    <text x="560" y="634" font-size="34" fill="#FFC94D" text-anchor="middle" font-weight="700" font-family="Consolas,monospace">46</text>

    <!-- 按钮 700..800 并排：确认(左) 取消(右) -->
    <g filter="url(#ds-neon-red)">
      <polygon points="112,706 328,706 340,718 340,782 328,794 112,794 100,782 100,718" fill="#3A1D22" stroke="#FF4D5E" stroke-width="2.5"/>
    </g>
    <text x="220" y="766" font-size="32" fill="#FFD8DC" text-anchor="middle" font-family="Source Han Serif SC,serif">确认出售</text>

    <polygon points="632,706 848,706 860,718 860,782 848,794 632,794 620,782 620,718" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
    <text x="740" y="766" font-size="32" fill="#E8F0FA" text-anchor="middle" font-family="Source Han Serif SC,serif">取消</text>
  </g>

  <text x="480" y="216" font-size="26" fill="#9FB3C8" text-anchor="middle" font-family="Consolas,monospace">C1 · SellConfirmView 800×620</text>

  <!--右：ConfirmView 760×560 中心 (1440,540) → x 1060..1820, y 260..820 -->
  <g>
    <rect x="1060" y="260" width="760" height="560" rx="12" fill="#1E2939" stroke="#3A4A63" stroke-width="2"/>
    <path d="M1060 284 L1060 272 Q1060 260 1072 260 L1808 260 Q1820 260 1820 272 L1820 284 Z" fill="#FF4D5E"/>

    <!-- 标题 340 -->
    <text x="1440" y="356" font-size="44" fill="#E8F0FA" font-weight="700" text-anchor="middle" font-family="Source Han Serif SC,serif">重置存档</text>

    <!-- 正文 440 / 484 -->
    <text x="1440" y="444" font-size="28" fill="#9FB3C8" text-anchor="middle" font-family="Source Han Serif SC,serif">将清空所有关卡进度与星级，</text>
    <text x="1440" y="488" font-size="28" fill="#9FB3C8" text-anchor="middle" font-family="Source Han Serif SC,serif">此操作不可撤销。</text>

    <!-- 危险图标 556 -->
    <g filter="url(#ds-neon-red)">
      <circle cx="1440" cy="556" r="22" fill="none" stroke="#FF4D5E" stroke-width="3"/>
      <line x1="1440" y1="545" x2="1440" y2="560" stroke="#FF4D5E" stroke-width="3" stroke-linecap="round"/>
      <circle cx="1440" cy="569" r="2.5" fill="#FF4D5E"/>
    </g>

    <!-- 按钮 660..760 并排：确定(左) 取消(右) -->
    <g filter="url(#ds-neon-red)">
      <polygon points="1112,664 1328,664 1340,676 1340,740 1328,752 1112,752 1100,740 1100,676" fill="#3A1D22" stroke="#FF4D5E" stroke-width="2.5"/>
    </g>
    <text x="1220" y="724" font-size="32" fill="#FFD8DC" text-anchor="middle" font-family="Source Han Serif SC,serif">确定</text>

    <polygon points="1552,664 1768,664 1780,676 1780,740 1768,752 1552,752 1540,740 1540,676" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
    <text x="1660" y="724" font-size="32" fill="#E8F0FA" text-anchor="middle" font-family="Source Han Serif SC,serif">取消</text>
  </g>

  <text x="1440" y="226" font-size="26" fill="#9FB3C8" text-anchor="middle" font-family="Consolas,monospace">C2 · ConfirmView 760×560（高随正文自适应）</text>

  <rect width="1920" height="1080" fill="url(#ds-vig)"/>

  <!--标注层 -->
  <g font-family="Consolas,monospace">
    <text x="44" y="1008" font-size="19" fill="#9FB3C8" fill-opacity="0.8">C1 SellConfirmView · ⚠️ 当前 GameFlowManager.cs:1011 点出售直接执行，须改为先弹确认</text>
    <text x="44" y="1034" font-size="19" fill="#9FB3C8" fill-opacity="0.6">★ v2 重排：面板加高（620/560），按钮区完全收进面板内 · 取消在右降低误触 · 退回额=累计投入×0.7</text>
    <text x="44" y="1058" font-size="19" fill="#9FB3C8" fill-opacity="0.7">C2 ConfirmView · 顶部色条按 type 联动: Info#35E0FF Success#FFC94D Danger#FF4D5E Warning#FF7A29</text>
  </g>
</svg>
