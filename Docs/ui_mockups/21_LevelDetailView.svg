<?xml version="1.0" encoding="UTF-8"?>
<!-- 21_LevelDetailView.svg — 关卡详情弹窗【正式版·深色科幻】
     几何与 prefab 实测一致（勿改坐标）；数据源: ArtDesign_坚守阵地_补全策划案_v1.md §B4
     坐标换算 x=960+X, y=540−Y
     ★ 布局重排版（v2）：Panel 改 1000×900，内部 zones 严格排布不溢出
       Panel y_svg 90..990｜标题 130｜副标题 186｜星级 250｜分割 300｜信息格 330..500
       ｜怪物预览 530..640｜按 钮 660..830（三按钮横排） -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="ds-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A3444"/><stop offset="0.5" stop-color="#1B2330"/><stop offset="1" stop-color="#222C3B"/>
    </linearGradient>
    <linearGradient id="ds-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC94D"/><stop offset="1" stop-color="#E8912B"/>
    </linearGradient>
    <radialGradient id="ds-vig" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.62" stop-color="#0B0E14" stop-opacity="0"/><stop offset="1" stop-color="#0B0E14" stop-opacity="0.66"/>
    </radialGradient>
    <filter id="ds-neon" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#35E0FF" flood-opacity="0.85"/>
    </filter>
    <pattern id="ds-grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#1C2532" stroke-width="1"/>
    </pattern>
  </defs>

  <!--世界层示意（战场） -->
  <rect width="1920" height="1080" fill="#10141D"/>
  <rect x="240" y="140" width="1440" height="800" fill="#131A26"/>
  <rect x="240" y="140" width="1440" height="800" fill="url(#ds-grid)" opacity="0.6"/>
  <path d="M320 540 H1600" fill="none" stroke="#35E0FF" stroke-opacity="0.4" stroke-width="18"/>
  <path d="M320 540 H1600" fill="none" stroke="#35E0FF" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="16 12"/>
  <circle cx="280" cy="540" r="26" fill="none" stroke="#35E0FF" stroke-width="3"/>
  <circle cx="1640" cy="540" r="26" fill="none" stroke="#FF4D5E" stroke-width="3"/>

  <!-- 压暗遮罩 -->
  <rect width="1920" height="1080" fill="#06090E" fill-opacity="0.72"/>

  <!--Panel 1000×900 中心 (960,540) → x 460..1460, y_svg 90..990 -->
  <rect x="460" y="90" width="1000" height="900" rx="12" fill="#1E2939" stroke="#3A4A63" stroke-width="2"/>
  <path d="M460 114 L460 102 Q460 90 472 90 L1448 90 Q1460 90 1460 102 L1460 114 Z" fill="#FFC94D"/>
  <rect x="470" y="120" width="980" height="860" rx="8" fill="none" stroke="#35E0FF" stroke-opacity="0.2" stroke-width="1"/>

  <!-- - 标题 130 / 副标题 186 -->
  <text x="960" y="146" font-size="48" fill="#E8F0FA" font-weight="700" text-anchor="middle"
        font-family="Source Han Serif SC,serif">第 3 关</text>
  <text x="960" y="196" font-size="30" fill="#9FB3C8" text-anchor="middle"
        font-family="Source Han Serif SC,serif">厚墙迷阵</text>

  <!-- - 星级行 250（星 64×64，x 中心 860/960/1060）+ 历史最佳文字 -->
  <g>
    <g filter="url(#ds-neon)">
      <polygon points="860,218 871,238 893,242 877,258 881,280 860,269 839,280 843,258 827,242 849,238" fill="url(#ds-gold)"/>
      <polygon points="960,218 971,238 993,242 977,258 981,280 960,269 939,280 943,258 927,242 949,238" fill="url(#ds-gold)"/>
    </g>
    <polygon points="1060,218 1071,238 1093,242 1077,258 1081,280 1060,269 1039,280 1043,258 1027,242 1049,238" fill="#1C2532" stroke="#5E7396" stroke-width="2"/>
    <text x="1160" y="262" font-size="26" fill="#9FB3C8" font-family="Source Han Serif SC,serif">历史最佳 2 星</text>
  </g>

  <!-- - 分割线 300 -->
  <line x1="520" y1="302" x2="1400" y2="302" stroke="#3A4A63" stroke-width="1" stroke-opacity="0.3"/>

  <!-- - 信息格 330..500（2 列 × 3 行 · cell 430×48 · 行距 60） -->
  <g>
    <rect x="520" y="322" width="430" height="50" rx="6" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="546" y="356" font-size="26" fill="#9FB3C8" font-family="Source Han Serif SC,serif">回合数</text>
    <text x="926" y="357" font-size="28" fill="#E8F0FA" text-anchor="end" font-weight="700" font-family="Consolas,monospace">5</text>

    <rect x="970" y="322" width="430" height="50" rx="6" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="996" y="356" font-size="26" fill="#9FB3C8" font-family="Source Han Serif SC,serif">波次</text>
    <text x="1376" y="357" font-size="28" fill="#E8F0FA" text-anchor="end" font-weight="700" font-family="Consolas,monospace">5</text>

    <rect x="520" y="384" width="430" height="50" rx="6" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="546" y="418" font-size="26" fill="#9FB3C8" font-family="Source Han Serif SC,serif">初始金币</text>
    <text x="926" y="419" font-size="28" fill="#FFC94D" text-anchor="end" font-weight="700" font-family="Consolas,monospace">380</text>

    <rect x="970" y="384" width="430" height="50" rx="6" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="996" y="418" font-size="26" fill="#9FB3C8" font-family="Source Han Serif SC,serif">初始生命</text>
    <text x="1376" y="419" font-size="28" fill="#FF4D5E" text-anchor="end" font-weight="700" font-family="Consolas,monospace">20</text>

    <rect x="520" y="446" width="430" height="50" rx="6" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="546" y="480" font-size="26" fill="#9FB3C8" font-family="Source Han Serif SC,serif">难度</text>
    <text x="926" y="481" font-size="28" fill="#FFC94D" text-anchor="end" font-weight="700" font-family="Consolas,monospace">★☆☆</text>

    <rect x="970" y="446" width="430" height="50" rx="6" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="996" y="480" font-size="26" fill="#9FB3C8" font-family="Source Han Serif SC,serif">最佳用时</text>
    <text x="1376" y="481" font-size="28" fill="#E8F0FA" text-anchor="end" font-weight="700" font-family="Consolas,monospace">--:--</text>
  </g>

  <!-- - 分割线 520 -->
  <line x1="520" y1="522" x2="1400" y2="522" stroke="#3A4A63" stroke-width="1" stroke-opacity="0.3"/>

  <!-- - 怪物预览 540..640 -->
  <text x="960" y="556" font-size="24" fill="#9FB3C8" text-anchor="middle" font-family="Source Han Serif SC,serif">本关出现怪物</text>
  <g>
    <rect x="700" y="570" width="64" height="64" rx="8" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="732" y="614" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="sans-serif">鼠</text>
    <rect x="776" y="570" width="64" height="64" rx="8" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="808" y="614" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="sans-serif">蝠</text>
    <rect x="852" y="570" width="64" height="64" rx="8" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="884" y="614" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="sans-serif">猪</text>
    <rect x="928" y="570" width="64" height="64" rx="8" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="960" y="614" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="sans-serif">狼</text>
    <rect x="1004" y="570" width="64" height="64" rx="8" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="1036" y="614" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="sans-serif">熊</text>
    <rect x="1080" y="570" width="64" height="64" rx="8" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="1112" y="614" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="sans-serif">蛛</text>
    <rect x="1156" y="570" width="64" height="64" rx="8" fill="#252F40" stroke="#3A4A63" stroke-width="1.5"/>
    <text x="1188" y="614" font-size="30" fill="#9FB3C8" text-anchor="middle" font-family="sans-serif">牛</text>
  </g>

  <!-- - 分割线 660 -->
  <line x1="520" y1="660" x2="1400" y2="660" stroke="#3A4A63" stroke-width="1" stroke-opacity="0.3"/>

  <!-- - 按钮 690..830：Play(主,宽560,居中) + Replay/Return(次,宽300,并排) -->
  <g>
    <!-- PlayBtn 560×88 中心 (960,734) -->
    <g filter="url(#ds-neon)">
      <polygon points="692,690 1228,690 1240,702 1240,766 1228,778 692,778 680,766 680,702" fill="#123845" stroke="#35E0FF" stroke-width="3"/>
    </g>
    <text x="960" y="748" font-size="36" fill="#DFFAFF" text-anchor="middle" font-weight="700" font-family="Source Han Serif SC,serif">开始挑战</text>

    <!-- ReplayBtn 300×76 中心 (800,816) -->
    <polygon points="664,790 936,790 948,802 948,854 936,866 664,866 652,854 652,802" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
    <text x="800" y="840" font-size="30" fill="#E8F0FA" text-anchor="middle" font-family="Source Han Serif SC,serif">从头重打</text>

    <!-- CloseBtn 300×76 中心 (1120,816) -->
    <polygon points="984,790 1256,790 1268,802 1268,854 1256,866 984,866 972,854 972,802" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
    <text x="1120" y="840" font-size="30" fill="#E8F0FA" text-anchor="middle" font-family="Source Han Serif SC,serif">返回</text>
  </g>

  <rect width="1920" height="1080" fill="url(#ds-vig)"/>

  <!--标注层 -->
  <g font-family="Consolas,monospace">
    <text x="44" y="1010" font-size="18" fill="#9FB3C8" fill-opacity="0.8">LevelDetailView · 弹窗 1000×900 · ★ v2 重排：Panel 加高至 900，内部 zones 全在面板内，按钮不再溢出</text>
    <text x="44" y="1036" font-size="18" fill="#9FB3C8" fill-opacity="0.6">TopBar 4px 金色=已通关 · 未通关用 Cyan · 未解锁只显示"返回"，隐藏"开始挑战/从头重打"</text>
    <text x="44" y="1060" font-size="18" fill="#9FB3C8" fill-opacity="0.7">数据源 tbsceneinfo/tbsround/SaveManager · 遮罩 rgba(6,9,14,0.72)</text>
  </g>
</svg>
