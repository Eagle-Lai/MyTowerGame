  <!-- Tips 浮字（点锁定关触发） -->
  <polygon points="776,664 1144,664 1156,676 1156,704 1144,716 776,716 764,704 764,676" fill="#131A26" stroke="#FFC94D" stroke-opacity="0.7" stroke-width="2"/>
