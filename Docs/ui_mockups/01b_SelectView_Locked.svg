  <!--标注层（图纸引出线，交付实现时可删） -->
  <g id="annotations" font-family="Consolas,monospace">
    <text x="420" y="252" font-size="20" fill="#9FB3C8" fill-opacity="0.8">母版 01 变体 · 差异：第 5–8 关未解锁</text>
    <text x="420" y="660" font-size="20" fill="#9FB3C8" fill-opacity="0.8">未解锁：按钮置灰 (0.5,0.5,0.5,0.6) · 星行换锁形图标 + 文案"未解锁"</text>
    <line x1="560" y1="648" x2="560" y2="606" stroke="#9FB3C8" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="700" y="752" font-size="20" fill="#9FB3C8" fill-opacity="0.8">锁定关仍可点击 → TipsView 提示（不进入关卡）</text>
    <line x1="960" y1="740" x2="960" y2="720" stroke="#9FB3C8" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="1140" y="252" font-size="20" fill="#9FB3C8" fill-opacity="0.8">解锁规则：通关第 N 关 → 解锁第 N+1 关（RecordClear 写存档）</text>
    <text x="44" y="1040" font-size="16" fill="#9FB3C8" fill-opacity="0.6">深色科幻正式版 · 01b 锁定变体 · Tips 走 TipsView 弹出（见 06 图）</text>
