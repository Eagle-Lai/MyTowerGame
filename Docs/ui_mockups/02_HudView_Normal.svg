    <path d="M386 961 a26 26 0 0 1 52 0" fill="none" stroke="#8C6239" stroke-width="5"/>
    <g transform="rotate(45 412 958)"><rect x="406" y="930" width="11" height="52" rx="4" fill="#9FB3C8" stroke="#3A4A63" stroke-width="1.5"/><rect x="380" y="952" width="52" height="11" rx="4" fill="#9FB3C8" stroke="#3A4A63" stroke-width="1.5"/></g>
    <circle cx="412" cy="958" r="8" fill="#C9D6E8"/>
    <polygon points="386,1040 438,1040 444,1048 444,1062 438,1068 386,1068 380,1062 380,1048" fill="#131A26" stroke="#3A4A63" stroke-width="1.5"/>
    <polygon points="399,1046 411,1046 416,1054 411,1062 399,1062 394,1054" fill="url(#ds-gold)"/>
    <text x="424" y="1061" font-size="20" fill="#FFC94D" font-weight="600">25</text>
