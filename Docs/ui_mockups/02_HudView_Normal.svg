    <polygon points="1208,1040 1260,1040 1266,1048 1266,1062 1260,1068 1208,1068 1202,1062 1202,1048" fill="#131A26" stroke="#3A4A63" stroke-width="1.5"/>
    <polygon points="1221,1046 1233,1046 1238,1054 1233,1062 1221,1062 1216,1054" fill="url(#ds-gold)"/>
    <text x="1246" y="1061" font-size="20" fill="#FFC94D" font-weight="600">35</text>
  </g>
