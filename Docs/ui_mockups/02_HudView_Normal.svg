    <rect x="626" y="907" width="120" height="120" rx="10" fill="none" stroke="#35E0FF" stroke-opacity="0.25" stroke-width="1"/>
    <rect x="656" y="932" width="60" height="46" rx="6" fill="#2A3138" stroke="#5E7396" stroke-width="3"/>
    <rect x="668" y="920" width="10" height="14" fill="#55627A"/><rect x="694" y="920" width="10" height="14" fill="#55627A"/>
    <polygon points="668,978 696,978 690,994 674,994" fill="url(#ds-fire)" filter="url(#ds-bloom)"/>
