    <polygon points="660,1040 712,1040 718,1048 718,1062 712,1068 660,1068 654,1062 654,1048" fill="#131A26" stroke="#3A4A63" stroke-width="1.5"/>
    <polygon points="673,1046 685,1046 690,1054 685,1062 673,1062 668,1054" fill="url(#ds-gold)"/>
    <text x="698" y="1061" font-size="20" fill="#FFC94D" font-weight="600">45</text>
  </g>
  <!-- Retard 水晶塔 -->
  <g>
    <rect x="896" y="903" width="128" height="128" rx="12" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
    <rect x="900" y="907" width="120" height="120" rx="10" fill="none" stroke="#35E0FF" stroke-opacity="0.25" stroke-width="1"/>
    <ellipse cx="960" cy="972" rx="30" ry="10" fill="#35E0FF" fill-opacity="0.18"/>
    <polygon points="934,960 986,960 976,984 944,984" fill="#1C2532" stroke="#5E7396" stroke-width="3"/>
    <path d="M960 916 l14 24 -14 24 -14 -24 z" fill="url(#ds-crystal)" filter="url(#ds-bloom)"/>
    <path d="M960 916 l0 48 M946 940 l28 0" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="1.5"/>
    <polygon points="934,1040 986,1040 992,1048 992,1062 986,1068 934,1068 928,1062 928,1048" fill="#131A26" stroke="#3A4A63" stroke-width="1.5"/>
    <polygon points="947,1046 959,1046 964,1054 959,1062 947,1062 942,1054" fill="url(#ds-gold)"/>
    <text x="972" y="1061" font-size="20" fill="#FFC94D" font-weight="600">30</text>
  </g>
  <!-- Pierce 钻头穿透（新形态示意，现复用 Normal 贴图） -->
  <g>
    <rect x="1170" y="903" width="128" height="128" rx="12" fill="url(#ds-panel)" stroke="#3A4A63" stroke-width="2"/>
    <rect x="1174" y="907" width="120" height="120" rx="10" fill="none" stroke="#7C5CFF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="6 5"/>
    <circle cx="1234" cy="972" r="24" fill="#2E4A66" stroke="#5E7396" stroke-width="3"/>
